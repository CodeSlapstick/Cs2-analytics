# nginx ในภาพของ frontend — เสิร์ฟ React ที่ / และส่งต่อทุกอย่างที่เป็นของ backend ไปที่ service api
# origin เดียว (พอร์ตเดียว) จึงไม่ต้องตั้ง CORS และคุกกี้ล็อกอินใช้ได้ตามปกติ
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;        # เดโมไฟล์ละหลายร้อย MB (backend มีเพดาน MAX_DEMO_MB ของตัวเองอีกชั้น)
    proxy_request_buffering off;       # ส่งไฟล์ผ่านไปเลย ไม่ต้องเก็บทั้งก้อนใน nginx ก่อน
    proxy_read_timeout 600s;

    # ถาม DNS ของ Docker (127.0.0.11) ใหม่ทุก 10 วินาที แทนการจำ IP ของ api ไว้ครั้งเดียวตอน nginx เปิด
    # ถ้าเขียน proxy_pass http://api:8000 ตรง ๆ พอ container api ถูกสร้างใหม่ (docker compose up --build api)
    # มันได้ IP ใหม่ แต่ nginx ยังยิงไป IP เก่า -> 502 ทุก request จนกว่าจะรีสตาร์ต frontend
    # การใส่ชื่อ host ผ่านตัวแปรบังคับให้ nginx resolve ตอน request ผ่าน resolver ข้างล่าง
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/    { proxy_pass $api; proxy_set_header Host $host; }
    location /auth/   { proxy_pass $api; proxy_set_header Host $host; }
    location /assets/ { proxy_pass $api; }   # ภาพเรดาร์ของ backend — ไฟล์ของ React อยู่ที่ /_app/ (vite.config.ts)

    # SPA: ทุก path ที่ไม่ใช่ไฟล์จริง ให้ index.html แล้ว react-router จัดการเอง
    location / { try_files $uri /index.html; }
}
