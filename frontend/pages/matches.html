<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แมตช์ · CS2 Analytics</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

<header class="topbar" id="topbar"></header>

<main class="wrap">

  <div class="page-head">
    <div>
      <div class="eyebrow">Matches</div>
      <h1>รายการแมตช์ <span class="sub" id="matchCount"></span></h1>
    </div>
  </div>

  <div class="cols">
    <!-- ซ้าย: ตารางแมตช์ทั้งหมด กดแถวได้ -->
    <div class="box">
      <div class="eyebrow">All matches</div>
      <h2>คลิกแถวเพื่อดูรายละเอียด</h2>
      <div id="matchTable"></div>
    </div>
    <!-- ขวา: รายละเอียดของแมตช์ที่เลือก matches.js เติมให้ -->
    <div class="box" id="matchDetail">
      <div class="empty">เลือกแมตช์จากตารางด้านซ้าย</div>
    </div>
  </div>

  <div class="foot">CS2 Tactical Analysis · SP-404 Senior Project · UTCC STECH</div>
</main>

<script src="/static/common.js"></script>
<script src="/static/matches.js"></script>
</body>
</html>
