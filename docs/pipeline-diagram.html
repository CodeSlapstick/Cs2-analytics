<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CS2 SCOUTING — อัปโหลดเดโมแล้วเกิดอะไรขึ้น</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 "Anuphan", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  main { max-width: 1340px; margin: 24px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 21px; font-weight: 700; fill: var(--fg); }
  .band { font-size: 15px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 700; fill: var(--fg); }
  /* ไดอะแกรมนี้ถูกฉายขึ้นโปรเจกเตอร์ — ตัวเล็กสุดในรูปต้องยังอ่านออกจากท้ายห้อง */
  .small { font-size: 13.5px; fill: var(--muted); }
  .edge-t { font-size: 13px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .edge.back { stroke-dasharray: 5 4; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
</style>
<main>
  <svg viewBox="0 0 1320 760" role="img" aria-label="ไดอะแกรม: อัปโหลดเดโม เก็บที่ไหน และ ML ทำงานอย่างไร">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
      </marker>
    </defs>

    <text class="title" x="20" y="32">อัปโหลดเดโม 1 ไฟล์ แล้วเกิดอะไรขึ้นบ้าง</text>
    <text class="small" x="20" y="54">ไฟล์ไปเก็บที่ไหน · ใครเป็นคนแกะ · ML เข้ามาทำงานตรงไหน</text>

    <!-- ================= ZONES ================= -->
    <rect class="zone" x="20" y="74" width="1280" height="292" rx="8" />
    <rect class="zone" x="20" y="400" width="1280" height="256" rx="8" />
    <text class="band" x="38" y="100">1 · ตอนอัปโหลด — ระบบทำเองทุกครั้ง</text>
    <text class="band" x="38" y="424">2 · ฝั่ง ML — รันด้วยมือครั้งเดียว ไม่ได้รันตอนเปิดเว็บ</text>

    <!-- ============ EDGES (วาดก่อนกล่อง ลูกศรจะได้อยู่หลังกล่อง) ============ -->
    <!-- แถวบน: เบราว์เซอร์ -> api -> คิว -> worker -> ฐานข้อมูล -->
    <path class="edge" d="M210 184 H314" marker-end="url(#a)" />
    <path class="edge" d="M540 184 H604" marker-end="url(#a)" />
    <path class="edge" d="M770 184 H834" marker-end="url(#a)" />
    <path class="edge" d="M1030 184 H1084" marker-end="url(#a)" />
    <!-- api -> ดิสก์ -->
    <path class="edge" d="M430 228 V262" marker-end="url(#a)" />
    <!-- ดิสก์ -> worker: worker อ่านไฟล์ .dem จากดิสก์ ไม่ได้อ่านจากฐานข้อมูล -->
    <path class="edge" d="M540 296 H860 Q890 296 890 266 V232" marker-end="url(#a)" />
    <!-- api -> เบราว์เซอร์: ตอบทันทีโดยไม่รอแกะ -->
    <path class="edge back" d="M340 140 V124 H125 V136" marker-end="url(#a)" />

    <text class="edge-t" x="262" y="168" text-anchor="middle">POST</text>
    <text class="edge-t" x="262" y="204" text-anchor="middle">/api/demos</text>
    <text class="edge-t" x="572" y="176" text-anchor="middle">เข้าคิว</text>
    <text class="edge-t" x="802" y="176" text-anchor="middle">หยิบงาน</text>
    <text class="edge-t" x="1057" y="176" text-anchor="middle">INSERT</text>
    <text class="edge-t" x="440" y="252" text-anchor="start">เขียนไฟล์ลงดิสก์</text>
    <text class="edge-t" x="700" y="288" text-anchor="middle">อ่านไฟล์ .dem</text>
    <text class="edge-t" x="360" y="128" text-anchor="start">ตอบ 202 ทันทีโดยไม่รอแกะ · หน้าเว็บถามสถานะเองทุก 2 วินาที จนขึ้น done</text>

    <!-- แถวล่าง: csv -> grid_ml1 -> json -> api -> แผนที่ -->
    <path class="edge" d="M222 542 H284" marker-end="url(#a)" />
    <path class="edge" d="M604 542 H658" marker-end="url(#a)" />
    <path class="edge" d="M848 542 H902" marker-end="url(#a)" />
    <path class="edge" d="M1082 542 H1136" marker-end="url(#a)" />
    <text class="edge-t" x="990" y="530" text-anchor="middle">อ่านครั้งเดียว</text>
    <text class="edge-t" x="990" y="556" text-anchor="middle">เก็บในหน่วยความจำ</text>
    <text class="edge-t" x="444" y="634" text-anchor="middle">ตลอดขั้นตอนนี้ไม่เคยบอกโมเดลว่าใครชนะ — เอา &quot;ใครชนะ&quot; มาตรวจทีหลังอย่างเดียว</text>

    <!-- ================= NODES ================= -->
    <!-- แถวบน -->
    <rect class="node input" x="40" y="140" width="170" height="88" rx="6" />
    <text class="label" x="64" y="170">เบราว์เซอร์</text>
    <text class="small" x="64" y="192">ลาก .dem มาวาง</text>
    <text class="small" x="64" y="212">ที่แถบซ้ายของเว็บ</text>

    <rect class="node process" x="314" y="140" width="226" height="88" rx="6" />
    <text class="label" x="338" y="166">api (FastAPI)</text>
    <text class="small" x="338" y="188">ตรวจชื่อไฟล์ก่อนแตะดิสก์</text>
    <text class="small" x="338" y="206">สร้างแถว matches (queued)</text>
    <text class="small" x="338" y="222">แล้วส่งงานเข้าคิว</text>

    <rect class="node storage" x="604" y="140" width="166" height="88" rx="6" />
    <text class="label" x="628" y="170">Redis</text>
    <text class="small" x="628" y="192">คิวงาน (RQ)</text>
    <text class="small" x="628" y="212">รอ worker มาหยิบ</text>

    <rect class="node process" x="834" y="140" width="196" height="88" rx="6" />
    <text class="label" x="858" y="166">worker</text>
    <text class="small" x="858" y="188">แกะเดโมด้วย awpy</text>
    <text class="small" x="858" y="206">(backend/parser.py)</text>
    <text class="small" x="858" y="222">พังแล้ว = error</text>

    <rect class="node storage" x="1084" y="140" width="196" height="88" rx="6" />
    <text class="label" x="1108" y="166">PostgreSQL</text>
    <text class="small" x="1108" y="188">kills · damages</text>
    <text class="small" x="1108" y="206">rounds · grenades</text>
    <text class="small" x="1108" y="222">player_positions</text>

    <rect class="node storage" x="314" y="262" width="226" height="68" rx="6" />
    <text class="label" x="338" y="288">demos/ บนดิสก์</text>
    <text class="small" x="338" y="310">ไฟล์ .dem ตัวจริง</text>
    <text class="small" x="338" y="326">ไม่ได้เก็บลงฐานข้อมูล</text>

    <!-- แถวล่าง -->
    <rect class="node neutral" x="40" y="498" width="182" height="88" rx="6" />
    <text class="label" x="64" y="524">data/all_kills.csv</text>
    <text class="small" x="64" y="546">7,158 การดวล</text>
    <text class="small" x="64" y="564">จาก 50 แมตช์ Mirage</text>
    <text class="small" x="64" y="580">(เตรียมไว้ครั้งเดียว)</text>

    <rect class="node process" x="284" y="470" width="320" height="144" rx="6" />
    <text class="label" x="308" y="498">research/grid_ml1.py</text>
    <text class="small" x="308" y="522">MeanShift รัศมี 300 หน่วย</text>
    <text class="small" x="308" y="540">→ จุดที่ดวลกันบ่อย 17 จุด (75% ของดวล)</text>
    <text class="small" x="308" y="566">KMeans k=3 บนโปรไฟล์ช่อง 32×32</text>
    <text class="small" x="308" y="584">→ ประเภทพื้นที่ + อัตราชนะดวลต่อช่อง</text>

    <rect class="node neutral" x="658" y="498" width="190" height="88" rx="6" />
    <text class="label" x="682" y="524">grid_ml1.json</text>
    <text class="small" x="682" y="546">192 ช่อง: ดวลกี่ครั้ง</text>
    <text class="small" x="682" y="564">CT ชนะดวลกี่ %</text>
    <text class="small" x="682" y="580">+ 17 จุดปะทะ</text>

    <rect class="node process" x="902" y="498" width="180" height="88" rx="6" />
    <text class="label" x="926" y="524">api</text>
    <text class="small" x="926" y="546">/api/review/grid</text>
    <text class="small" x="926" y="564">แปลงเป็นพิกเซล</text>
    <text class="small" x="926" y="580">บนภาพเรดาร์</text>

    <rect class="node external" x="1136" y="498" width="144" height="88" rx="6" />
    <text class="label" x="1160" y="524">แผนที่รอบ</text>
    <text class="small" x="1160" y="546">ระบายกริด:</text>
    <text class="small" x="1160" y="564">ดวลบ่อย ·</text>
    <text class="small" x="1160" y="580">ได้เปรียบ CT / T</text>

    <!-- ================= LEGEND ================= -->
    <rect class="node input" x="40" y="686" width="16" height="16" rx="3" />
    <text class="small" x="64" y="699">ผู้ใช้</text>
    <rect class="node process" x="130" y="686" width="16" height="16" rx="3" />
    <text class="small" x="154" y="699">โปรแกรมที่ประมวลผล</text>
    <rect class="node storage" x="310" y="686" width="16" height="16" rx="3" />
    <text class="small" x="334" y="699">ที่เก็บข้อมูล</text>
    <rect class="node neutral" x="440" y="686" width="16" height="16" rx="3" />
    <text class="small" x="464" y="699">ไฟล์ที่เตรียมไว้ล่วงหน้า</text>
    <rect class="node external" x="640" y="686" width="16" height="16" rx="3" />
    <text class="small" x="664" y="699">สิ่งที่ผู้ใช้เห็น</text>
    <path class="edge back" d="M770 694 H812" marker-end="url(#a)" />
    <text class="small" x="822" y="699">เส้นประ = คำตอบกลับไปหาหน้าเว็บ</text>
    <text class="small" x="1076" y="699">ตัวเลขทุกตัวมาจากข้อมูลจริงในระบบ</text>
  </svg>
</main>
