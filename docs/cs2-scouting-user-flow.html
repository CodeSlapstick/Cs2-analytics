<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS2 Scouting User Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#fffdfa;--ink:#173b72;--text:#182132;--muted:#637287;--rule:#cbd6e5;--blue:#eaf2fc;--blue2:#d7e8fb;--orange:#ef9e17;--orange2:#fff1d5;--red:#c95050;--red2:#fff1f1}
    *{box-sizing:border-box} html,body{margin:0;background:#eef1f5;color:var(--text);font-family:"Anuphan",sans-serif}
    main{width:min(100%,1400px);margin:0 auto;padding:24px}.diagram-container{overflow-x:auto;background:var(--paper);border:1px solid #e0e6ee}
    svg{display:block;width:100%;min-width:1280px;height:auto;background:var(--paper)}
    .title{font:700 36px "Chakra Petch",sans-serif;fill:var(--ink)}.subtitle{font:500 18px "Anuphan",sans-serif;fill:var(--muted)}
    .section{font:700 14px "Anuphan",sans-serif;fill:var(--ink)}.node-title{font:700 17px "Anuphan",sans-serif;fill:var(--ink)}
    .node-copy{font:500 13px "Anuphan",sans-serif;fill:var(--muted)}.small{font:500 12px "Anuphan",sans-serif;fill:var(--muted)}
    .num{font:700 18px "Chakra Petch",sans-serif;fill:#fff}.decision{font:700 15px "Anuphan",sans-serif;fill:var(--ink)}
    .edge-label{font:600 12px "Anuphan",sans-serif;fill:var(--muted)}
    @media print{main{padding:0}.diagram-container{border:0;overflow:visible}svg{min-width:0}}
  </style>
</head>
<body>
<main>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="cs2-user-flow-title cs2-user-flow-desc">
      <title id="cs2-user-flow-title">User Flow ของเว็บ CS2 Scouting</title>
      <desc id="cs2-user-flow-desc">เส้นทางหลักตั้งแต่เข้าสู่ระบบ เลือกหรืออัปโหลดเดโม รีวิวแมตช์ วิเคราะห์ข้อมูล และส่งออกผลสำหรับโค้ช</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#73839a"/></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef9e17"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#fffdfa"/>
      <text x="72" y="72" class="title">USER FLOW — CS2 SCOUTING</text>
      <text x="72" y="105" class="subtitle">เส้นทางใช้งานจริง: จากไฟล์การแข่งขันสู่ข้อมูลที่โค้ชใช้ทบทวนแผน</text>
      <line x1="72" y1="130" x2="1208" y2="130" stroke="#173b72" stroke-width="2"/>

      <text x="72" y="166" class="section">เริ่มต้น</text>
      <text x="380" y="166" class="section">นำข้อมูลเข้าสู่ระบบ</text>
      <text x="760" y="166" class="section">อ่านและวิเคราะห์</text>
      <text x="1080" y="166" class="section">นำไปใช้</text>

      <!-- connectors behind nodes -->
      <path d="M236 246H300" fill="none" stroke="#73839a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M468 246H520" fill="none" stroke="#73839a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M650 246H784" fill="none" stroke="#73839a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M585 301V348" fill="none" stroke="#ef9e17" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
      <path d="M738 402H784V302" fill="none" stroke="#ef9e17" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
      <path d="M944 246H964" fill="none" stroke="#73839a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M1068 302V348" fill="none" stroke="#73839a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M1068 458V500" fill="none" stroke="#ef9e17" stroke-width="2.5" marker-end="url(#arrow-accent)"/>

      <!-- label masks -->
      <rect x="690" y="232" width="48" height="22" rx="4" fill="#fffdfa"/><text x="714" y="247" text-anchor="middle" class="edge-label">มี</text>
      <rect x="596" y="318" width="52" height="22" rx="4" fill="#fffdfa"/><text x="622" y="333" text-anchor="middle" class="edge-label">ไม่มี</text>

      <!-- node 1 -->
      <rect x="72" y="198" width="164" height="96" rx="8" fill="#eaf2fc" stroke="#7b9bc5" stroke-width="1.5"/>
      <circle cx="96" cy="222" r="15" fill="#173b72"/><text x="96" y="228" text-anchor="middle" class="num">1</text>
      <text x="118" y="229" class="node-title">เข้าสู่ระบบ</text>
      <text x="96" y="261" class="node-copy">Steam หรือ Guest</text>

      <!-- node 2 -->
      <rect x="300" y="198" width="168" height="96" rx="8" fill="#eaf2fc" stroke="#7b9bc5" stroke-width="1.5"/>
      <circle cx="324" cy="222" r="15" fill="#173b72"/><text x="324" y="228" text-anchor="middle" class="num">2</text>
      <text x="346" y="229" class="node-title">หน้าแมตช์</text>
      <text x="324" y="261" class="node-copy">ดูรายการการแข่งขัน</text>

      <!-- decision -->
      <path d="M585 191L650 246L585 301L520 246Z" fill="#fff1d5" stroke="#ef9e17" stroke-width="2"/>
      <text x="585" y="240" text-anchor="middle" class="decision">มี Demo</text>
      <text x="585" y="260" text-anchor="middle" class="decision">ในระบบแล้ว?</text>

      <!-- upload -->
      <rect x="432" y="348" width="144" height="108" rx="8" fill="#fff1d5" stroke="#ef9e17" stroke-width="2"/>
      <circle cx="456" cy="372" r="15" fill="#ef9e17"/><text x="456" y="378" text-anchor="middle" class="num">3</text>
      <text x="478" y="379" class="node-title">อัปโหลด</text>
      <text x="456" y="412" class="node-copy">ไฟล์การแข่งขัน .dem</text>
      <text x="456" y="435" class="small">เฉพาะบัญชี Steam</text>

      <!-- parse -->
      <rect x="594" y="348" width="144" height="108" rx="8" fill="#fff1d5" stroke="#ef9e17" stroke-width="2"/>
      <circle cx="618" cy="372" r="15" fill="#ef9e17"/><text x="618" y="378" text-anchor="middle" class="num">4</text>
      <text x="640" y="379" class="node-title">Parse Demo</text>
      <text x="618" y="412" class="node-copy">แสดงสถานะระหว่างประมวลผล</text>
      <text x="618" y="435" class="small">เสร็จแล้วเปิดรอบแรก</text>

      <!-- match workspace -->
      <rect x="784" y="190" width="160" height="112" rx="8" fill="#d7e8fb" stroke="#173b72" stroke-width="2"/>
      <circle cx="808" cy="214" r="15" fill="#173b72"/><text x="808" y="220" text-anchor="middle" class="num">5</text>
      <text x="832" y="221" class="node-title">รีวิวแมตช์</text>
      <text x="808" y="253" class="node-copy">เลือกแมตช์ · Scoreboard</text>
      <text x="808" y="276" class="node-copy">รายรอบ · Heatmap · Economy</text>

      <!-- analysis -->
      <rect x="964" y="190" width="208" height="112" rx="8" fill="#d7e8fb" stroke="#173b72" stroke-width="2"/>
      <circle cx="988" cy="214" r="15" fill="#173b72"/><text x="988" y="220" text-anchor="middle" class="num">6</text>
      <text x="1010" y="221" class="node-title">เครื่องมือวิเคราะห์</text>
      <text x="988" y="253" class="small">Death Heatmap · Opening Route</text>
      <text x="988" y="276" class="small">Player Behavior · Player Role</text>

      <!-- coach -->
      <rect x="964" y="348" width="208" height="110" rx="8" fill="#eaf2fc" stroke="#7b9bc5" stroke-width="1.5"/>
      <circle cx="988" cy="372" r="15" fill="#173b72"/><text x="988" y="378" text-anchor="middle" class="num">7</text>
      <text x="1010" y="379" class="node-title">Coach Review</text>
      <text x="988" y="412" class="node-copy">ค้นหาจุดสำคัญและทบทวนแผน</text>
      <text x="988" y="435" class="small">ใช้ข้อเท็จจริง ไม่ตัดสินผู้เล่น</text>

      <!-- export -->
      <rect x="964" y="500" width="208" height="96" rx="8" fill="#fff1d5" stroke="#ef9e17" stroke-width="2"/>
      <circle cx="988" cy="524" r="15" fill="#ef9e17"/><text x="988" y="530" text-anchor="middle" class="num">8</text>
      <text x="1010" y="531" class="node-title">Export Report</text>
      <text x="988" y="564" class="node-copy">สรุปรอบ PNG · รายงาน PNG / PDF</text>

      <!-- factual note -->
      <rect x="72" y="624" width="1100" height="48" rx="6" fill="#f4f7fb" stroke="#cbd6e5"/>
      <rect x="72" y="624" width="8" height="48" rx="4" fill="#173b72"/>
      <text x="100" y="654" class="node-copy">ข้อมูลจากไฟล์ที่อัปโหลดใช้สำหรับวิเคราะห์แมตช์เท่านั้น และไม่ถูกนำกลับไป Train โมเดลอ้างอิง</text>
    </svg>
  </div>
</main>
</body>
</html>
