<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การวิเคราะห์พฤติกรรมผู้เล่นจากไฟล์ DEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f8fafc;
      --paper-2: #e2e8f0;
      --ink: #172033;
      --muted: #5b6475;
      --soft: #7c8798;
      --rule: rgba(23,32,51,.12);
      --rule-solid: #64748b;
      --accent: #4338ca;
      --accent-tint: rgba(67,56,202,.08);
    }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans Thai', 'Geist', system-ui, sans-serif;
      padding: 40px 28px;
    }
    .frame { width: 100%; max-width: 1280px; margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font-family: 'Noto Sans Thai', 'Instrument Serif', serif;
      font-size: clamp(28px, 3vw, 40px);
      font-weight: 500;
      line-height: 1.2;
    }
    .subtitle { margin-bottom: 24px; color: var(--muted); font-size: 15px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    .thai { font-family: 'Noto Sans Thai', 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">DATA FLOW · PLAYER BEHAVIOR</p>
    <h1>จากไฟล์ .dem สู่ Player Role</h1>
    <p class="subtitle">ระบบเปลี่ยนเหตุการณ์ในเกมเป็นตัวเลขพฤติกรรม แล้วจัดกลุ่มผู้เล่นที่มีรูปแบบคล้ายกัน</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="player-role-flow-title player-role-flow-desc">
        <title id="player-role-flow-title">การวิเคราะห์พฤติกรรมผู้เล่นจากไฟล์ DEM</title>
        <desc id="player-role-flow-desc">แสดงกระบวนการอ่านไฟล์ DEM สร้างตารางเหตุการณ์ใน Excel คำนวณตัวชี้วัดพฤติกรรม ปรับสเกลและจัดกลุ่มด้วย K-Means ก่อนแปลผลเป็น Player Role แยกฝั่ง T และ CT</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6475"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4338ca"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f8fafc"/>

        <!-- stage headers -->
        <text x="40" y="60" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#7c8798">01 · RAW SOURCE</text>
        <text x="288" y="60" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#7c8798">02 · EVENT TABLE</text>
        <text x="536" y="60" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#7c8798">03 · FEATURE BUILD</text>
        <text x="784" y="60" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#7c8798">04 · MACHINE LEARNING</text>
        <text x="1032" y="60" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#4338ca">05 · OUTPUT</text>

        <!-- arrows behind nodes -->
        <line x1="240" y1="216" x2="280" y2="216" stroke="#5b6475" stroke-width="1.6" marker-end="url(#arrow)"/>
        <line x1="488" y1="216" x2="528" y2="216" stroke="#5b6475" stroke-width="1.6" marker-end="url(#arrow)"/>
        <line x1="736" y1="216" x2="776" y2="216" stroke="#5b6475" stroke-width="1.6" marker-end="url(#arrow)"/>
        <line x1="984" y1="216" x2="1024" y2="216" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow-accent)"/>
        <rect x="982" y="184" width="60" height="14" rx="2" fill="#f8fafc"/>
        <text x="1012" y="194" class="mono" font-size="8" text-anchor="middle" letter-spacing=".5" fill="#4338ca">ASSIGN ROLE</text>

        <!-- node 1 -->
        <rect x="40" y="88" width="200" height="256" rx="6" fill="#f8fafc"/>
        <rect x="40" y="88" width="200" height="256" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
        <rect x="52" y="100" width="40" height="16" rx="2" fill="transparent" stroke="#64748b" stroke-opacity=".45"/>
        <text x="72" y="111" class="mono" font-size="8" text-anchor="middle" fill="#5b6475">INPUT</text>
        <text x="140" y="160" class="thai" font-size="16" font-weight="600" text-anchor="middle" fill="#172033">ไฟล์การแข่งขัน .dem</text>
        <text x="140" y="184" class="mono" font-size="9" text-anchor="middle" fill="#7c8798">CS2 MATCH DEMO</text>
        <line x1="64" y1="208" x2="216" y2="208" stroke="rgba(23,32,51,.12)"/>
        <text x="64" y="236" class="thai" font-size="12" fill="#5b6475">• เหตุการณ์การฆ่า</text>
        <text x="64" y="262" class="thai" font-size="12" fill="#5b6475">• เวลาและหมายเลขรอบ</text>
        <text x="64" y="288" class="thai" font-size="12" fill="#5b6475">• ผู้เล่น ฝั่ง และตำแหน่ง</text>
        <text x="64" y="314" class="thai" font-size="12" fill="#5b6475">• สถานะวางระเบิด</text>

        <!-- node 2 -->
        <rect x="288" y="88" width="200" height="256" rx="6" fill="#f8fafc"/>
        <rect x="288" y="88" width="200" height="256" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
        <rect x="300" y="100" width="44" height="16" rx="2" fill="transparent" stroke="#64748b" stroke-opacity=".45"/>
        <text x="322" y="111" class="mono" font-size="8" text-anchor="middle" fill="#5b6475">TABLE</text>
        <text x="388" y="152" class="thai" font-size="16" font-weight="600" text-anchor="middle" fill="#172033">ตาราง All Kills</text>
        <text x="388" y="176" class="mono" font-size="9" text-anchor="middle" fill="#7c8798">1 ROW = 1 KILL EVENT</text>
        <line x1="312" y1="200" x2="464" y2="200" stroke="rgba(23,32,51,.12)"/>
        <text x="312" y="228" class="mono" font-size="9" fill="#5b6475">is_opening_kill</text>
        <text x="312" y="250" class="mono" font-size="9" fill="#5b6475">is_early_engagement</text>
        <text x="312" y="272" class="mono" font-size="9" fill="#5b6475">is_trade_kill</text>
        <text x="312" y="294" class="mono" font-size="9" fill="#5b6475">assistedflash</text>
        <text x="312" y="316" class="mono" font-size="9" fill="#5b6475">attacker_place</text>

        <!-- node 3 -->
        <rect x="536" y="88" width="200" height="256" rx="6" fill="#f8fafc"/>
        <rect x="536" y="88" width="200" height="256" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
        <rect x="548" y="100" width="52" height="16" rx="2" fill="transparent" stroke="#64748b" stroke-opacity=".45"/>
        <text x="574" y="111" class="mono" font-size="8" text-anchor="middle" fill="#5b6475">FEATURE</text>
        <text x="636" y="152" class="thai" font-size="16" font-weight="600" text-anchor="middle" fill="#172033">Player Profile</text>
        <text x="636" y="176" class="mono" font-size="9" text-anchor="middle" fill="#7c8798">PLAYER · MATCH · SIDE</text>
        <line x1="560" y1="200" x2="712" y2="200" stroke="rgba(23,32,51,.12)"/>
        <text x="560" y="228" class="thai" font-size="12" fill="#5b6475">Opening / Early rate</text>
        <text x="560" y="250" class="thai" font-size="12" fill="#5b6475">Trade / Assist rate</text>
        <text x="560" y="272" class="thai" font-size="12" fill="#5b6475">Flash / Post-plant</text>
        <text x="560" y="294" class="thai" font-size="12" fill="#5b6475">Site engagement</text>
        <text x="560" y="316" class="thai" font-size="12" fill="#5b6475">Timing / Place diversity</text>

        <!-- node 4 -->
        <rect x="784" y="88" width="200" height="256" rx="6" fill="#f8fafc"/>
        <rect x="784" y="88" width="200" height="256" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
        <rect x="796" y="100" width="32" height="16" rx="2" fill="transparent" stroke="#64748b" stroke-opacity=".45"/>
        <text x="812" y="111" class="mono" font-size="8" text-anchor="middle" fill="#5b6475">ML</text>
        <text x="884" y="152" class="thai" font-size="16" font-weight="600" text-anchor="middle" fill="#172033">Standardize + K-Means</text>
        <text x="884" y="176" class="mono" font-size="9" text-anchor="middle" fill="#7c8798">UNSUPERVISED CLUSTERING</text>
        <line x1="808" y1="200" x2="960" y2="200" stroke="rgba(23,32,51,.12)"/>
        <text x="808" y="230" class="thai" font-size="12" fill="#5b6475">1. แยกข้อมูลฝั่ง T / CT</text>
        <text x="808" y="258" class="thai" font-size="12" fill="#5b6475">2. ปรับ features เป็น z-score</text>
        <text x="808" y="286" class="thai" font-size="12" fill="#5b6475">3. จัดพฤติกรรมที่คล้ายกัน</text>
        <text x="808" y="314" class="thai" font-size="12" fill="#5b6475">4. หา centroid ที่ใกล้ที่สุด</text>

        <!-- node 5 focal -->
        <rect x="1032" y="88" width="208" height="256" rx="6" fill="#f8fafc"/>
        <rect x="1032" y="88" width="208" height="256" rx="6" fill="rgba(67,56,202,.08)" stroke="#4338ca" stroke-width="2"/>
        <rect x="1044" y="100" width="48" height="16" rx="2" fill="#4338ca"/>
        <text x="1068" y="111" class="mono" font-size="8" text-anchor="middle" fill="#ffffff">OUTPUT</text>
        <text x="1136" y="152" class="thai" font-size="16" font-weight="600" text-anchor="middle" fill="#172033">Player Role</text>
        <text x="1136" y="176" class="mono" font-size="9" text-anchor="middle" fill="#4338ca">BEHAVIOR IN THIS MATCH</text>
        <line x1="1056" y1="200" x2="1216" y2="200" stroke="rgba(67,56,202,.24)"/>
        <text x="1056" y="228" class="thai" font-size="12" fill="#172033">T: Entry · Support · Lurker</text>
        <text x="1056" y="252" class="thai" font-size="12" fill="#172033">Trader · Site Executor</text>
        <text x="1056" y="282" class="thai" font-size="12" fill="#172033">CT: Anchor · Rotator</text>
        <text x="1056" y="306" class="thai" font-size="12" fill="#172033">Aggressive · Retake</text>
        <text x="1056" y="330" class="thai" font-size="12" fill="#172033">Utility Support</text>

        <!-- interpretation band -->
        <rect x="40" y="392" width="1200" height="176" rx="6" fill="#ffffff" stroke="rgba(23,32,51,.12)"/>
        <text x="64" y="424" class="mono" font-size="8" font-weight="500" letter-spacing="1.4" fill="#7c8798">HOW THE SIGNALS BECOME ROLES</text>
        <line x1="280" y1="448" x2="280" y2="536" stroke="rgba(23,32,51,.12)"/>
        <line x1="520" y1="448" x2="520" y2="536" stroke="rgba(23,32,51,.12)"/>
        <line x1="760" y1="448" x2="760" y2="536" stroke="rgba(23,32,51,.12)"/>
        <line x1="1000" y1="448" x2="1000" y2="536" stroke="rgba(23,32,51,.12)"/>
        <text x="64" y="468" class="thai" font-size="14" font-weight="600" fill="#172033">Opening สูง</text>
        <text x="64" y="496" class="thai" font-size="12" fill="#5b6475">Entry / Aggressive Defender</text>
        <text x="304" y="468" class="thai" font-size="14" font-weight="600" fill="#172033">Assist + Flash สูง</text>
        <text x="304" y="496" class="thai" font-size="12" fill="#5b6475">Support / Utility Support</text>
        <text x="544" y="468" class="thai" font-size="14" font-weight="600" fill="#172033">Trade สูง</text>
        <text x="544" y="496" class="thai" font-size="12" fill="#5b6475">Trader</text>
        <text x="784" y="468" class="thai" font-size="14" font-weight="600" fill="#172033">Site + Post-plant สูง</text>
        <text x="784" y="496" class="thai" font-size="12" fill="#5b6475">Site Executor / Retake</text>
        <text x="1024" y="468" class="thai" font-size="14" font-weight="600" fill="#172033">เล่นจุดเดิม / หลายจุด</text>
        <text x="1024" y="496" class="thai" font-size="12" fill="#5b6475">Anchor / Rotator</text>
        <text x="64" y="548" class="thai" font-size="11" fill="#7c8798">หมายเหตุ: Role คือรูปแบบพฤติกรรมในแมตช์นั้น ไม่ใช่ตำแหน่งถาวรหรือคะแนนความเก่งของผู้เล่น</text>

        <!-- legend -->
        <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(23,32,51,.12)"/>
        <text x="40" y="650" class="mono" font-size="8" letter-spacing="1.2" fill="#5b6475">LEGEND</text>
        <rect x="124" y="638" width="24" height="16" rx="2" fill="#ffffff" stroke="#64748b"/>
        <text x="160" y="650" class="thai" font-size="11" fill="#5b6475">ข้อมูลและขั้นตอนประมวลผล</text>
        <rect x="360" y="638" width="24" height="16" rx="2" fill="rgba(67,56,202,.08)" stroke="#4338ca" stroke-width="2"/>
        <text x="396" y="650" class="thai" font-size="11" fill="#5b6475">ผลลัพธ์ที่ต้องการอธิบาย</text>
        <line x1="624" y1="646" x2="664" y2="646" stroke="#5b6475" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="680" y="650" class="thai" font-size="11" fill="#5b6475">การไหลของข้อมูล</text>
      </svg>
    </div>
  </main>
</body>
</html>
