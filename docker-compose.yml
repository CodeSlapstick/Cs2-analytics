# PostgreSQL สำหรับ CS2 Map Zone Analytics
#
#   docker compose up -d db     # เปิดฐานข้อมูล
#   docker compose down         # ปิด (ข้อมูลยังอยู่ใน volume pgdata)
#   docker compose down -v      # ปิดแล้วลบข้อมูลทิ้ง
#
# ค่าดีฟอลต์ตรงกับที่ frontend/app.py คาดไว้ คือ postgres/postgres/cs2_analytics
# ถ้าเครื่องมี PostgreSQL ลงไว้อยู่แล้ว พอร์ต 5432 จะชนกัน ให้ตั้ง POSTGRES_PORT=5433 ใน .env
# แล้วชี้ DATABASE_URL ไปที่พอร์ตนั้นด้วย
#
# ตาราง users ที่หน้าล็อกอินใช้ ยังต้องสร้างเองครั้งแรก:
#   docker compose exec db psql -U postgres -d cs2_analytics -c "CREATE TABLE IF NOT EXISTS users (steamid VARCHAR(32) PRIMARY KEY, name VARCHAR(255), avatar TEXT, profile_url TEXT, mode VARCHAR(32), last_login TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"

services:
  db:
    image: postgres:16-alpine
    container_name: cs2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cs2_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cs2_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ตัวรันสคริปต์ Python สำหรับคนที่ไม่อยากลง Python ในเครื่อง
  #   docker compose run --rm tools python pipeline/grid_ml.py
  tools:
    build: .
    profiles: ["tools"]          # ไม่ถูกสร้างตอน `up` ปกติ ต้องเรียกด้วย `run` เท่านั้น
    volumes:
      - ./output:/app/output

volumes:
  pgdata:
