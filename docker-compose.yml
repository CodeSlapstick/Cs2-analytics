# PostgreSQL สำหรับ dev — ใช้เมื่ออยากรันบน Postgres server จริง
#
#   docker compose up -d db          เปิด
#   docker compose down              ปิด (ข้อมูลยังอยู่ใน volume)
#   docker compose down -v           ปิดและลบข้อมูลทิ้งทั้งหมด
#
# แล้วตั้งใน backend/.env:
#   DATABASE_URL=postgres://cs2:cs2@localhost:5433/cs2_analytics
#
# ไม่มี Docker ก็ยังรันโปรเจกต์ได้ — ถ้าไม่ตั้ง DATABASE_URL ระบบจะใช้ PGlite
# (Postgres 18 แบบฝังในโปรเซส Node) เก็บไฟล์ที่ backend/data/pgdata ให้เอง
# ดูรายละเอียดใน backend/src/db.js

services:
  db:
    image: postgres:17-alpine
    container_name: cs2-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cs2
      POSTGRES_PASSWORD: cs2
      POSTGRES_DB: cs2_analytics
      # เร่งขึ้นเล็กน้อยตอน dev — ห้ามใช้ค่านี้ตอน production (ไฟดับแล้วข้อมูลหายได้)
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      # ใช้ 5433 ฝั่งเครื่องเรา กันชนกับ Postgres ตัวอื่นที่อาจลงไว้อยู่แล้วที่ 5432
      - '5433:5432'
    volumes:
      - cs2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cs2 -d cs2_analytics']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cs2_pgdata:
