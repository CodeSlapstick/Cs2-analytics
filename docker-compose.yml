# CS2 Scouting Platform — ทั้งระบบในคำสั่งเดียว
#
#   docker compose up -d                       # db + redis + api + worker + frontend  ->  http://localhost:3000 (API/หน้าเดิม :8000)
#   docker compose up -d db redis              # เปิดแค่ฐานข้อมูลกับคิว (ตอนรัน python api/worker ในเครื่องเอง)
#   docker compose logs -f api worker          # ดู log
#   docker compose down                        # ปิด (ข้อมูลยังอยู่ใน volume pgdata)
#   docker compose down -v                     # ปิดแล้วลบข้อมูลทิ้ง
#
# ค่าตั้งอ่านจาก .env ที่รากโปรเจกต์ (ก๊อปจาก .env.example) ถ้าไม่มีใช้ค่าดีฟอลต์ที่เขียนไว้ตรงนี้
# ถ้าเครื่องมี PostgreSQL ลงไว้อยู่แล้ว พอร์ต 5432 จะชนกัน ให้ตั้ง POSTGRES_PORT=5433 ใน .env
# แล้วชี้ DATABASE_URL ของฝั่ง python-ในเครื่อง ไปที่พอร์ตนั้นด้วย (service ใน compose ไม่กระทบ เพราะคุยกันในเครือข่ายของ compose)
#
# ลำดับตอนสตาร์ต: db พร้อม -> api รัน `alembic upgrade head` (สร้าง/อัปเดตตาราง) -> สร้าง dev user -> เปิดเซิร์ฟเวอร์
# worker ไม่แตะสคีมาเอง แค่รอรับงานจาก redis

x-backend: &backend
  build: .
  environment: &backend-env
    # ในเครือข่ายของ compose ชื่อโฮสต์คือ db / redis ไม่ใช่ localhost และพอร์ตคือค่าใน container เสมอ
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cs2_analytics}
    REDIS_URL: redis://redis:6379/0
    QUEUE_BACKEND: rq
  volumes:
    - ./demos:/app/demos            # ไฟล์ .dem ที่อัปโหลด — api เขียน worker อ่าน ต้องเห็นโฟลเดอร์เดียวกัน
    - ./output:/app/output          # ผล parse (json) และผลจาก research/ ที่รันในเครื่อง
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    container_name: cs2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cs2_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cs2_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: cs2-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # เซิร์ฟเวอร์หลังบ้าน (FastAPI) — /api/* + หน้าเว็บ vanilla ของ Sprint 1 (backend/web)
  api:
    <<: *backend
    container_name: cs2-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      SECRET_KEY: ${SECRET_KEY:-}              # กุญแจเซ็น JWT — ไม่ตั้ง = สุ่มใหม่ทุกครั้งที่ api รีสตาร์ต (ทุกคนต้องล็อกอินใหม่)
      ALLOW_REGISTER: ${ALLOW_REGISTER:-1}     # 1 = สมัครสมาชิกเองได้ที่หน้า /login
      COOKIE_SECURE: ${COOKIE_SECURE:-0}       # 1 = คุกกี้ส่งเฉพาะ HTTPS
      DEV_USERNAME: ${DEV_USERNAME:-dev}       # user สำหรับ dev ที่ backend.seed_user สร้างให้ตอนสตาร์ต
      DEV_PASSWORD: ${DEV_PASSWORD:-cs2dev1234}
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "alembic upgrade head && python -m backend.seed_user && python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000"

  # ตัวแกะเดโมในเบื้องหลัง — งานเดียวคือ backend.jobs.parse_demo(match_id)
  worker:
    <<: *backend
    container_name: cs2-worker
    restart: unless-stopped
    command: python -m backend.worker

  # หน้าเว็บ Sprint 2 (React) — nginx เสิร์ฟไฟล์ที่ build แล้ว และส่งต่อ /api ไปที่ api  ->  http://localhost:3000
  frontend:
    build: ./frontend
    container_name: cs2-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
