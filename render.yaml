services:
  - type: web
    name: cs2-analytics-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: alembic upgrade head && python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cs2-analytics-db
          property: connectionString
      - key: QUEUE_BACKEND
        value: thread
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: STEAM_API_KEY
        sync: false

databases:
  - name: cs2-analytics-db
    databaseName: cs2_analytics
    user: cs2_analytics
    region: singapore
    plan: free
    postgresMajorVersion: "16"
