# Alembic - database schema migrations (ASCII only: Windows reads this file with the locale codec)
#
#   alembic upgrade head          create / update tables to the latest revision (safe on an existing DB)
#   alembic downgrade -1          step back one revision
#   alembic revision -m "..."     new empty migration (write the SQL/op yourself, keep backend/models.py in sync)
#   alembic history               list revisions
#
# The database URL is NOT set here: backend/alembic/env.py reads DATABASE_URL from .env

[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
